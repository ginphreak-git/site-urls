name: Aggiorna i domini
on:
  schedule:
    - cron: "17 */6 * * *"   # ogni 6 ore
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova i domini e riscrive i file se serve
        run: python3 tools/probe.py
      - name: Commit se cambiato
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add soul.json pz8.json
            git commit -m "Domini aggiornati automaticamente"
            git push
          fi
